<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizApp</title>
    <link rel="icon" href="./assets/Quizapp/logo.png" type="image/png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wdth,wght@75..125,300..700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/card.css">
    <link rel="stylesheet" href="./styles/darkmode.css">

    <script src="./scripts/db.js"></script>
    <script src="./script.js"></script>
    <script src="scripts/darkmode.js" ></script>

    <!-- Bootstrap files -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</head>

<body onload="init()">

    <nav id="nav" class="navbar bg-body-tertiary">
        <div>
            <button id="darkmode_btn" class="btn btn-secondary darkmode-btn" onclick="NightMode()">Dark Mode</button>
       </div>
        <div class="container-fluid dp-flex">
            <a class="navbar-brand mb-0 h1" href="#">QuizApp</a>
        </div>
        </div>

    </nav>

    <div class="card-container" id="startscreen">
        <div class="card quiz-card">
            <img src="assets/Quizapp/logo.png" class="card-img-top logo" alt="gtionmarks" id="logo">

            <div id="card_body1" class="card-body dp-flex">
                <p class="card-text subheadline">Teste dein Wissen!</p>
                <button class="btn btn-primary" onclick="startQuiz()">Start</button>
            </div>
        </div>
    </div>

    <div class="card-container" id="quizscreen" style="display: none;">
        <div class="card quiz-card">
            <img src="assets/question_marks.jpg" class="card-img-top img-question" alt="questionmarks">

            <div class="progress">
                <div id="progress_bar" class="progress-bar progress-bar-striped progress-bar-animated"
                    role="progressbar" aria-valuenow="" aria-valuemin="0" aria-valuemax="100" style="width: 0%"></div>
            </div>

            <div id="card_body2" class="card-body">
                <h5 class="card-title" id="question_number"></h5>
                <p class="question-text" id="question_text"></p>
                <div class="card quiz-answer-card mb-6" onclick="answer('answer_1')">
                    <p class="card-body font-answer" id="answer_1">
                    </p>
                </div>
                <div class="card quiz-answer-card mb-6" onclick="answer('answer_2')">
                    <p class="card-body font-answer" id="answer_2">
                    </p>
                </div>
                <div class="card quiz-answer-card mb-6" onclick="answer('answer_3')">
                    <p class="card-body font-answer" id="answer_3">
                    </p>
                </div>
                <div class="card quiz-answer-card mb-6" onclick="answer('answer_4')">
                    <p class="card-body font-answer" id="answer_4">
                    </p>
                </div>

                <div id="card_footer" class="card-footer">
                    <div>
                        <span class="font-card-footer">Frage <b id="question-number-2"></b> von <b
                                id="questions_length"></b></span>
                    </div>
                    <div>
                        <button class="btn btn-secondary btn-sm" id="try_again" onclick="tryAgain()"
                            disabled>Nochmal</button>
                        <button class="btn btn-primary btn-sm" id="next_question" onclick="nextQuestion()"
                            disabled>Nächste
                            Frage</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card-container dp-flex-row" id="endscreen" style="display: none;">

        <img class="trophy-left" src="assets/Quizapp/tropy.png" alt="trophy">

        <div class="card quiz-card">
            <img src="assets/Quizapp/brain result.png" id="brain_logo" class="card-img-top ob-fit img-brain" alt="brain result">

            <div class="progress">
                <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar"
                    aria-valuenow="75" aria-valuemin="0" aria-valuemax="100" style="width: 100%">100%</div>
            </div>

            <div id="card_body3" class="card-body dp-flex">
                <h5 class="card-title text-center">Quiz beendet</h5>
                <p class="card-text text-center" id="score"></p>
                <button class="btn btn-primary" onclick="startQuizAgain()">Nochmal</button>
            </div>
        </div>

        <img src="assets/Quizapp/tropy.png" alt="trophy">
    </div>


    <footer class="bg-body-tertiary text-center text-lg-start ">
        <div class="text-center p-3 vh5">
            © 2025 QuizApp
        </div>
    </footer>
</body>


</html>
